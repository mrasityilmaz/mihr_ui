name: "Flutter Package"
description: "Build, lint, test, and score a Flutter package."

inputs:
  codecov_token:
    description: "Codecov token for coverage upload"
    required: false
    default: ""
  collect_coverage:
    description: "Whether to collect and verify code coverage"
    required: false
    default: "true"
  collect_score:
    description: "Whether to verify the pana pub score"
    required: false
    default: "true"
  concurrency:
    description: "Test concurrency (-j flag)"
    required: false
    default: "4"
  coverage_excludes:
    description: "Globs to exclude from coverage (space-separated)"
    required: false
    default: ""
  flutter_channel:
    description: "Flutter channel (stable, beta, master)"
    required: false
    default: "stable"
  working_directory:
    description: "Package root directory"
    required: false
    default: "."
  min_coverage:
    description: "Minimum coverage percentage required"
    required: false
    default: "60"
  analyze_directories:
    description: "Directories to analyze"
    required: false
    default: "lib test"
  report_on:
    description: "Directories to report coverage on"
    required: false
    default: "lib"

runs:
  using: "composite"
  steps:
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.flutter_channel }}

    - name: 📦 Install Dependencies
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: flutter pub get

    - name: ✨ Format Check
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: dart format --set-exit-if-changed .

    - name: 🔍 Analyze
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: dart analyze --fatal-infos --fatal-warnings ${{ inputs.analyze_directories }}

    - name: 🧪 Run Tests
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        if [ -d "test" ]; then
          flutter test -j ${{ inputs.concurrency }} --no-pub --test-randomize-ordering-seed random --coverage
        fi

    - name: 🧹 Exclude Generated Code from Coverage
      if: ${{ inputs.collect_coverage == 'true' && inputs.coverage_excludes != '' }}
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        mv coverage/lcov.info coverage/lcov.info.bak
        sudo apt-get -y install lcov
        lcov --remove coverage/lcov.info.bak ${{ inputs.coverage_excludes }} -o coverage/lcov.info

    - name: 📦 Detect Package Name
      if: ${{ inputs.collect_coverage == 'true' }}
      id: package
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.working_directory }}
      run: echo "name=${PACKAGE_PATH##*/}" >> "$GITHUB_OUTPUT"

    - name: ⬆️ Upload Coverage to Codecov
      if: ${{ inputs.collect_coverage == 'true' }}
      uses: codecov/codecov-action@v5
      with:
        flags: ${{ steps.package.outputs.name }}
        token: ${{ inputs.codecov_token }}

    - name: 📊 Verify Coverage
      if: ${{ inputs.collect_coverage == 'true' }}
      uses: VeryGoodOpenSource/very_good_coverage@v3
      with:
        path: ${{ inputs.working_directory }}/coverage/lcov.info
        exclude: ${{ inputs.coverage_excludes }}
        min_coverage: ${{ inputs.min_coverage }}

    - name: 💯 Verify Pub Score
      if: ${{ inputs.collect_score == 'true' }}
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        dart pub global activate pana
        PANA=$(pana . --no-warning)
        PANA_SCORE=$(echo "$PANA" | sed -n "s/.*Points: \([0-9]*\)\/\([0-9]*\).*/\1\/\2/p")
        echo "$PANA"
        IFS='/' read -ra SCORE_ARR <<< "$PANA_SCORE"
        SCORE=${SCORE_ARR[0]}
        TOTAL=${SCORE_ARR[1]}
        if (( SCORE < TOTAL )); then
          echo "❌ Pana score $SCORE/$TOTAL — expected $TOTAL/$TOTAL"
          exit 1
        fi
