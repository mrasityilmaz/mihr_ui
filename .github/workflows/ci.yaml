name: CI

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [develop, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🏗️ Flutter Package
        uses: ./.github/actions/flutter_package
        with:
          min_coverage: "60"
